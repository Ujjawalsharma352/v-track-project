# ===========================================
# V-Track Backend - Application Configuration
# ===========================================

# Server port
server.port=${PORT:8080}

# MySQL Database Configuration
# Set the password through SPRING_DATASOURCE_PASSWORD; override other values as needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vtrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vtrack_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Required admin credentials and API token; supply through environment variables.
vtrack.admin.username=${VTRACK_ADMIN_USERNAME}
vtrack.admin.password=${VTRACK_ADMIN_PASSWORD}
vtrack.auth.token=${VTRACK_AUTH_TOKEN}

# Frontend origins allowed to call the API (same-origin production needs no extra origins).
vtrack.cors.allowed-origins=${VTRACK_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
