# ===========================================
# V-Track Backend - Application Configuration
# ===========================================

# Server port
server.port=8080

# MySQL Database Configuration
# Update these values to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/vtrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Admin credentials (simple - for demo; use env vars in production)
vtrack.admin.username=admin
vtrack.admin.password=admin123
# Token issued on login - frontend sends this in X-Auth-Token or Authorization: Bearer
vtrack.auth.token=vtrack-admin-token

# Allow CORS for frontend (VS Code Live Server typically uses different port)
# Frontend will run on same host - adjust if needed
vtrack.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
