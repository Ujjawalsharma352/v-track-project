<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Track - View Logs</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <span class="nav-brand">V-Track</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">View Logs</h1>

    <div class="filters">
      <div class="form-group">
        <label for="filterDate">Date (yyyy-MM-dd)</label>
        <input type="date" id="filterDate">
      </div>
      <div class="form-group">
        <label for="filterVehicle">Vehicle Number</label>
        <input type="text" id="filterVehicle" placeholder="Partial match">
      </div>
      <button type="button" class="btn btn-primary" id="applyFilters">Apply Filters</button>
      <button type="button" class="btn btn-secondary" id="showAll">Show All</button>
      <button type="button" class="btn btn-success" id="exportCsv">Export CSV</button>
    </div>

    <div id="logsError" class="alert alert-error" style="display: none;"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Vehicle #</th>
            <th>Type</th>
            <th>Driver</th>
            <th>Purpose</th>
            <th>Entry Time</th>
            <th>Exit Time</th>
            <th>Duration</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="logsTableBody">
          <tr><td colspan="8">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    function renderLogs(logs) {
      const tbody = document.getElementById('logsTableBody');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8">No logs found.</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr class="${log.overstayAlert ? 'overstay' : ''}">
          <td>${escapeHtml(log.vehicleNumber)}</td>
          <td>${escapeHtml(log.vehicleType)}</td>
          <td>${escapeHtml(log.driverName || '-')}</td>
          <td>${escapeHtml(log.purpose || '-')}</td>
          <td>${formatDateTime(log.entryTime)}</td>
          <td>${log.exitTime ? formatDateTime(log.exitTime) : '-'}</td>
          <td>${formatDuration(log.durationInMinutes)}</td>
          <td>${log.status} ${log.overstayAlert ? '(Overstay)' : ''}</td>
        </tr>
      `).join('');
    }

    function escapeHtml(s) {
      if (s == null) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function loadLogs() {
      const vehicleNumber = document.getElementById('filterVehicle').value.trim();
      const date = document.getElementById('filterDate').value;
      const errEl = document.getElementById('logsError');
      try {
        let logs;
        if (vehicleNumber || date) {
          logs = await searchLogs(vehicleNumber || undefined, date || undefined);
        } else {
          logs = await getAllLogs();
        }
        renderLogs(logs);
        errEl.style.display = 'none';
      } catch (err) {
        document.getElementById('logsTableBody').innerHTML = '<tr><td colspan="8">Error loading logs.</td></tr>';
        errEl.textContent = err.message || 'Failed to load logs';
        errEl.style.display = 'block';
      }
    }

    document.getElementById('applyFilters').addEventListener('click', loadLogs);
    document.getElementById('showAll').addEventListener('click', () => {
      document.getElementById('filterVehicle').value = '';
      document.getElementById('filterDate').value = '';
      loadLogs();
    });
    document.getElementById('exportCsv').addEventListener('click', () => exportCsv());

    loadLogs();
  </script>
</body>
</html>
