<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Track - Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <span class="nav-brand">V-Track</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="active">Login</a>
    </div>
  </nav>

  <main class="container login-page">
    <h1 class="page-title">Admin Login</h1>
    <div class="card" style="max-width: 400px;">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <div id="loginError" class="alert alert-error" style="display: none;"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    function getPostLoginLocation() {
      const returnTo = new URLSearchParams(window.location.search).get('returnTo');
      return ['entry.html', 'exit.html', 'dashboard.html', 'logs.html', 'search.html'].includes(returnTo)
        ? returnTo
        : 'dashboard.html';
    }

    // Resume a pending navbar search after authentication.
    if (isLoggedIn()) {
      window.location.href = getPostLoginLocation();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const data = await login(username, password);
        if (data.success) {
          window.location.href = getPostLoginLocation();
        } else {
          errorEl.textContent = data.message || 'Invalid credentials';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
