<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Track - Vehicle Entry</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <span class="nav-brand">V-Track</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="entry.html" class="active">Entry</a>
      <a href="exit.html">Exit</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="logs.html">Logs</a>
      <a href="search.html">Search</a>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">Vehicle Entry</h1>
    <div class="card" style="max-width: 500px;">
      <form id="entryForm">
        <div class="form-group">
          <label for="vehicleNumber">Vehicle Number *</label>
          <input type="text" id="vehicleNumber" name="vehicleNumber" required placeholder="e.g. MH-12-AB-1234">
        </div>
        <div class="form-group">
          <label for="vehicleType">Vehicle Type *</label>
          <select id="vehicleType" name="vehicleType" required>
            <option value="">Select type</option>
            <option value="Car">Car</option>
            <option value="Bike">Bike</option>
            <option value="Truck">Truck</option>
          </select>
        </div>
        <div class="form-group">
          <label for="driverName">Driver Name (optional)</label>
          <input type="text" id="driverName" name="driverName" placeholder="Driver name">
        </div>
        <div class="form-group">
          <label for="purpose">Purpose (optional)</label>
          <input type="text" id="purpose" name="purpose" placeholder="e.g. Visit, Delivery">
        </div>
        <div id="entryError" class="alert alert-error" style="display: none;"></div>
        <button type="submit" class="btn btn-primary" id="entryBtn">Record Entry</button>
      </form>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h3>Entry Recorded</h3>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="confirmOk">OK</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('entryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('entryError');
      const btn = document.getElementById('entryBtn');
      errorEl.style.display = 'none';

      const body = {
        vehicleNumber: document.getElementById('vehicleNumber').value.trim(),
        vehicleType: document.getElementById('vehicleType').value,
        driverName: document.getElementById('driverName').value.trim() || null,
        purpose: document.getElementById('purpose').value.trim() || null,
      };

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const data = await addEntry(body);
        document.getElementById('confirmMessage').textContent =
          `Vehicle ${data.vehicleNumber} (${data.vehicleType}) entered at ${formatDateTime(data.entryTime)}.`;
        document.getElementById('confirmModal').style.display = 'flex';
        document.getElementById('entryForm').reset();
      } catch (err) {
        errorEl.textContent = err.message || 'Failed to record entry';
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Record Entry';
      }
    });

    document.getElementById('confirmOk').addEventListener('click', () => {
      document.getElementById('confirmModal').style.display = 'none';
    });
  </script>
</body>
</html>
